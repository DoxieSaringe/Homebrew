<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Light beam -->
  <polygon points="21,13 32,7 32,25 21,19" fill="#00d4ff" opacity="0.22"/>
  <!-- Projector body -->
  <rect x="2" y="11" width="21" height="10" rx="2.5" fill="#00d4ff"/>
  <!-- Vent slits on body -->
  <line x1="7"  y1="13.5" x2="7"  y2="18.5" stroke="#0a0a0a" stroke-width="1.5" opacity="0.45"/>
  <line x1="11" y1="13.5" x2="11" y2="18.5" stroke="#0a0a0a" stroke-width="1.5" opacity="0.45"/>
  <line x1="15" y1="13.5" x2="15" y2="18.5" stroke="#0a0a0a" stroke-width="1.5" opacity="0.45"/>
  <!-- Lens ring -->
  <circle cx="21" cy="16" r="4" fill="#0d0d0d" stroke="#00d4ff" stroke-width="1.2"/>
  <!-- Lens glass -->
  <circle cx="21" cy="16" r="2.5" fill="#00d4ff" opacity="0.18"/>
  <!-- Lens highlight -->
  <circle cx="20" cy="15" r="1" fill="#ffffff" opacity="0.45"/>
  <!-- Feet -->
  <rect x="5"  y="21" width="2.5" height="3" rx="1" fill="#00d4ff" opacity="0.6"/>
  <rect x="15" y="21" width="2.5" height="3" rx="1" fill="#00d4ff" opacity="0.6"/>
</svg>
